<!doctype html>
<!-- 生成文件：改 web/src/template.html、web/src/main.js 后跑 node build-web.mjs -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCT-LOFT 3D 场地地图</title>
<style>
  /* 字体、配色、组件形态对齐 muShenzhen M2 原型（prototype/DESIGN.md 与 structure-*.css 的 token）：
     canvas #f5f5f5 / surface #fff / ink #201f1c / muted #5a514a / line #d8d1cb / soft #eeeae6 / accent #dfff2f / brand #6d3425；
     系统无衬线字体，标题字重 650；细线分隔、不用投影；主操作 lime 填充。只借视觉语言，未复制其代码或素材 */
  :root { --canvas:#f5f5f5; --surface:#fff; --ink:#201f1c; --muted:#5a514a; --line:#d8d1cb; --soft:#eeeae6; --seg:#e8e4df; --segline:#b9b1aa; --tag:#eeebe7; --status:#f7ffc4; --accent:#dfff2f; --brand:#6d3425; --metro:#b3261e; --bus:#2f6b4f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  body.picking #c { cursor:crosshair; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .lb { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-size:12px; pointer-events:none; font-variant-numeric:tabular-nums; }
  .lb.hit { pointer-events:auto; cursor:pointer; }
  body.picking .lb.hit { pointer-events:none; }
  .lb.hit:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  .lb.loft { font-weight:650; font-size:14px; color:var(--ink); text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; }
  .lb.loft.sel { background:var(--accent); border:2px solid var(--brand); border-radius:4px; padding:0 5px; text-shadow:none; }
  /* C2 主会场强化（候选） */
  .lb.c2 { font-size:16px; font-weight:650; border-radius:4px; padding:2px 8px; text-shadow:none; z-index:1; }
  .lb.c2-a { background:var(--brand); color:#fff; }
  .lb.c2.sel { background:var(--accent); color:var(--ink); border:2px solid var(--brand); }   /* 选中时 lime 底配深色字，白字在 lime 上看不清 */
  .lb.c2-b { background:none; color:var(--ink); font-size:20px; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; }   /* 单行字不加框（pollux 约定） */
  .lb.c2-c { background:none; color:#fff; font-size:20px; text-shadow:none; }   /* 标牌不用黑底白字（pollux 约定），只靠深色体量强化 */
  .lb.c2flag { background:var(--brand); color:#fff; font-size:12px; font-weight:650; padding:1px 6px; border-radius:2px; pointer-events:auto; cursor:pointer; }
  .lb.road { color:var(--muted); font-size:12px; letter-spacing:1px; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; }
  .lb.metro { background:var(--surface); color:var(--metro); border:1px solid var(--metro); padding:1px 7px; border-radius:4px; font-weight:650; }
  .lb.exit { background:var(--metro); color:#fff; padding:0 4px; border-radius:4px; font-size:11px; font-weight:650; }
  .lb.bus { background:var(--surface); color:var(--bus); border:1px solid var(--bus); padding:0 5px; border-radius:4px; font-size:11px; }
  /* 附近 WeWork 方位标（2026-11-20）：在画面里钉在原位，出画面贴边、箭头指向它 */
  .ww { position:absolute; transform:translate(-50%,-50%); pointer-events:auto; display:flex; align-items:center; gap:4px; background:var(--surface); color:var(--ink); border:1px solid var(--ink); border-radius:4px; padding:1px 6px; font:inherit; font-size:12px; font-weight:600; white-space:nowrap; cursor:pointer; font-variant-numeric:tabular-nums; }
  .ww .ar { display:inline-block; transform:rotate(var(--a, 0rad)); font-size:11px; line-height:1; }
  .ww:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  #panel .wwb h3 { font-size:17px; font-weight:650; line-height:1.5; margin:0; padding-bottom:4px; }   /* 分档标题比条目名高一级（mushenzhen-m2 日期分组同款） */
  #panel .wwb h3 .n { font-size:13px; font-weight:400; color:var(--muted); margin-left:4px; }   /* 加空格后读屏不连读 */
  #panel .wwl { list-style:none; margin:0; padding:0; display:grid; }
  #panel .wwl li { display:grid; gap:2px; padding:10px 0; }
  #panel .wwl .nm { font-size:16px; font-weight:650; line-height:1.35; }
  #panel .wwl .mt { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #panel .wwl small { color:var(--muted); font-size:13px; }
  .lb.route { background:var(--surface); color:var(--ink); border:1px solid var(--ink); padding:1px 7px; border-radius:4px; font-weight:650; }
  .lb.route.end { background:var(--accent); color:var(--ink); border:2px solid var(--brand); }
  /* 顶栏：大标题 + 右侧小字场所名（同参考 Map 页） */
  header { position:fixed; top:16px; left:16px; width:min(420px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 15px 12px; }
  header .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  header h1 { margin:0; font-size:28px; font-weight:650; letter-spacing:-0.4px; line-height:1.15; }
  header .hub { font-size:12px; color:var(--ink); }
  header p { margin:6px 0 0; font-size:13px; color:var(--muted); }
  /* 图层开关 / 视角：分段控件，选中 lime、未选中浅灰、无外框（同参考 List/Week/Month） */
  .legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .seg { min-height:36px; padding:6px 11px; border-radius:8px; border:none; background:var(--soft); color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:13px; }
  .legend .seg { background:var(--soft); color:var(--muted); box-shadow:inset 0 0 0 1px transparent; }
  .legend .seg[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--segline); }
  .legend .seg.icon { width:44px; height:44px; min-height:44px; padding:0; justify-content:center; }
  .legend .seg.icon svg { display:block; }
  .legend .seg[aria-pressed="false"]:not(.emph-btn) svg { opacity:.3; }
  /* 「强调园区楼栋」：未按下是普通白底；按下用品牌棕（参考项目第二主题色）实心强化 */
  .legend .seg.emph-btn { background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--segline); }
  .legend .seg.emph-btn[aria-pressed="true"] { background:var(--brand); color:#fff; box-shadow:none; }
  body.emph .lb.loft { background:var(--brand); color:#fff; text-shadow:none; border-radius:4px; padding:0 5px; }
  body.emph .lb.loft.sel { background:var(--accent); color:var(--ink); }
  .legend { flex-wrap:nowrap; justify-content:space-between; }
  #views .seg.on { background:var(--accent); color:var(--ink); }   /* lime 只留给选中和主操作 */
  .seg:focus-visible, #panel button:focus-visible, .actions.dock button:focus-visible, .slot-x:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .sw { width:10px; height:10px; border-radius:2px; display:inline-block; border:1px solid #0003; }
  #views { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:6px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px; max-width:calc(100vw - 32px); overflow-x:auto; }
  #views .seg { min-height:40px; white-space:nowrap; background:var(--surface); color:var(--ink); }
  #views .seg.empty { color:var(--muted); background:var(--canvas); }
  #views .seg:disabled, #mviews .seg:disabled, .vrows .mghost:disabled { opacity:.45; cursor:not-allowed; }   /* 存满 3 个后「+ 存视角」变灰 */
  #views .seg.primary { background:var(--accent); color:var(--ink); font-weight:650; }
  #views .seg.primary[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--segline); }   /* 「取消选点」白底细框，不用深色块（ui-review.md 第 2 条） */
  .slot { display:inline-flex; align-items:center; background:var(--soft); border-radius:8px; }
  .slot .seg { background:transparent !important; padding-right:4px; }
  .slot-x { border:none; background:none; width:32px; min-height:40px; color:var(--muted); cursor:pointer; font-size:16px; }
  #views .div { width:1px; align-self:stretch; background:var(--line); margin:4px 2px; }
  body.iso #views .seg.on::after { content:attr(data-lock); font-size:11px; color:var(--muted); margin-left:2px; }
  /* 语言切换：同参考的分段控件 */
  /* 语言切换：单个按钮，只显示要切换过去的那种语言（中文状态显示 EN，英文状态显示 中文），减少视觉占用 */
  #lang { display:inline-flex; }
  #langBtn { border:1px solid var(--line); background:var(--surface); min-height:36px; min-width:44px; padding:0 10px; border-radius:8px; font-size:13px; font-weight:650; color:var(--ink); cursor:pointer; }
  #langBtn:hover { background:var(--soft); }
  #langBtn:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  header .hub { margin-top:2px; }
  #hint { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:calc(100vw - 32px); text-align:center; background:var(--surface); color:var(--ink); border:1px solid var(--line); padding:8px 14px; border-radius:8px; font-size:13px; }
  /* 详情：同参考 Event details，分段标题 + 细线分隔 + 底部主操作 */
  #panel { position:fixed; right:16px; top:16px; width:min(340px, calc(100vw - 32px)); max-height:calc(100vh - 110px); overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 20px; font-size:15px; display:none; }
  #panel .eyebrow { font-size:13px; color:var(--muted); }
  #panel h2 { margin:2px 0 6px; padding-right:40px; font-size:26px; font-weight:650; letter-spacing:-0.3px; line-height:1.2; }   /* 右侧让出关闭 ×，长标题（英文版）换行而不贴着 × */
  #panel .tags { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
  #panel .tag { font-size:12px; background:var(--tag); border-radius:4px; padding:2px 6px; }
  #panel .status-pill { font-size:12px; background:var(--status); border-radius:4px; padding:2px 6px; }
  #panel section { padding:12px 0; border-top:1px solid var(--line); margin-top:10px; }
  #panel section h3 { margin:0 0 4px; font-size:15px; font-weight:650; }
  #panel section p { margin:0; }
  #panel .k { color:var(--muted); font-size:13px; }
  /* 迷你时间线：左侧细线 + 年份等宽数字 */
  #panel .tl ol { list-style:none; margin:0; padding:0 0 0 12px; border-left:1px solid var(--line); }
  #panel .tl li { position:relative; display:flex; gap:10px; padding:4px 0; font-size:14px; }
  #panel .tl li::before { content:""; position:absolute; left:-16px; top:12px; width:7px; height:7px; border-radius:50%; background:var(--brand); }
  #panel .tl .yr { flex:none; width:46px; font-weight:650; font-variant-numeric:tabular-nums; }
  #panel .tl .ev small { display:block; font-size:13px; color:var(--muted); }
  /* 相关报道 */
  #panel .refs ul { list-style:none; margin:0; padding:0; }
  #panel .refs li { padding:8px 0; border-top:1px solid var(--soft); }
  #panel .refs li:first-child { border-top:none; padding-top:0; }
  #panel .refs a { color:var(--ink); font-weight:650; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
  #panel .refs a:hover { text-decoration-color:var(--ink); }
  #panel .refs .nolink { font-weight:650; }
  #panel .refs .meta { font-size:13px; color:var(--muted); margin-top:2px; }
  #panel .refs p { font-size:14px; margin:2px 0 0; }
  #panel .refs details summary { cursor:pointer; font-size:13px; color:var(--ink); min-height:44px; display:flex; align-items:center; }
  #panel .refs .foot { margin-top:8px; font-size:13px; }
  /* 逐段指引（oct-loft-route）：桌面列全部路段，点一段地图高亮；手机收成步进条（一次一段） */
  #panel .steps ol { list-style:none; margin:0; padding:0; }
  #panel .steps li button { display:flex; gap:10px; width:100%; min-height:44px; padding:8px 6px; margin:0; border:none; box-sizing:border-box; border-radius:6px; background:none; text-align:left; font:inherit; color:var(--ink); cursor:pointer; line-height:1.45; }
  #panel .steps li button:hover { background:var(--soft); }
  #panel .steps li button[aria-pressed="true"] { background:var(--soft); box-shadow:inset 3px 0 0 var(--brand); }
  #panel .steps .n { flex:none; width:22px; height:22px; border-radius:50%; background:var(--soft); font-size:12px; font-variant-numeric:tabular-nums; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  #panel .steps li button[aria-pressed="true"] .n { background:var(--accent); }
  #panel .stepper { display:none; align-items:center; gap:8px; margin:8px 0 4px; }
  #panel .stepper .st-b { flex:none; width:44px; height:44px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:20px; color:var(--ink); cursor:pointer; }
  #panel .stepper .st-b:disabled { color:var(--line); cursor:default; }
  #panel .stepper .st-t { flex:1; display:flex; flex-direction:column; font-size:14px; line-height:1.45; }
  @media (max-width: 640px) { #panel .stepper { display:flex; } #panel .steps { display:none; } }
  #panel .sub { margin:0 0 4px; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }   /* 标题下元信息（距离等事实），不用状态胶囊 */
  #panel #pc .trv .go { border:1px solid #829700; min-height:48px; }
  #panel .actions { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--line); margin-top:4px; }
  /* 主操作（从这栋楼导航到 C2 等）贴在卡片底部常驻，不用滚到最下面才看到（pollux 2026-11-20）；手机同样贴在底部面板底（ui-review.md 第 1 条 A）。
     同参考 Event details 底栏：上方细线，次操作在左、lime 主操作在右撑满 */
  #panel .actions { position:sticky; bottom:-16px; background:var(--surface); padding-bottom:16px; margin-bottom:-16px; z-index:1; margin-left:-20px; margin-right:-20px; padding-left:20px; padding-right:20px; }   /* 底栏横向铺满卡片内边距，盖住时间线圆点，不露在底栏左边 */
  #panel .primary, .actions.dock .primary { flex:1; min-height:48px; border:1px solid #829700; border-radius:8px; background:var(--accent); color:var(--ink); font-weight:650; font-size:14px; cursor:pointer; }
  #panel .primary .ico, .actions.dock .primary .ico { width:18px; height:18px; flex:none; margin-right:6px; vertical-align:-3px; }   /* 导航箭头图标 */
  #panel .primary:has(.ico), .actions.dock .primary:has(.ico) { display:inline-flex; align-items:center; justify-content:center; }
  #panel .primary:hover, .actions.dock .primary:hover, .mprimary:not([aria-pressed="true"]):hover { background:#c9e71f; }
  #panel .ghost, .actions.dock .ghost { min-height:48px; padding:0 14px; border:1px solid var(--segline); border-radius:8px; background:var(--surface); cursor:pointer; font-size:14px; }
  #panel .x { position:absolute; right:6px; top:6px; width:44px; height:44px; border:none; background:none; font-size:22px; color:var(--muted); cursor:pointer; }
  header .attr { margin-top:8px; font-size:11px; color:var(--muted); }   /* ODbL 署名常驻顶栏，不和底部工具条重叠 */
  /* 布局分档（避免组件重叠）：≥ 900px 顶栏左上 + 详情右上；641–899px 详情改成工具条上方的整宽底部卡；≤ 640px 手机底部卡 */
  @media (max-width: 899px) {
    #panel { top:auto; left:16px; right:16px; width:auto; bottom:84px; max-height:min(45vh, calc(100vh - 84px - 16px - var(--header-h, 200px) - 12px)); }   /* 不超过半屏，地图仍可见 */
    #views { max-width:calc(100vw - 32px); }
  }
  @media (max-width: 640px) {
    header { top:10px; left:10px; right:10px; width:auto; padding:10px 12px; }
    header h1 { font-size:22px; } header p { display:none; }
    .seg { min-height:44px; font-size:12px; padding:4px 9px; }
    #views { left:10px; right:10px; transform:none; bottom:calc(10px + env(safe-area-inset-bottom)); }
    #panel { top:auto; bottom:calc(76px + env(safe-area-inset-bottom)); right:10px; left:10px; width:auto; max-height:calc(100vh - 76px - env(safe-area-inset-bottom) - var(--header-h, 200px) - 20px); z-index:2; }
  }

  /* ===== 手机版方案 C（pollux 2026-11-20 选定；来自 mobile-plan/rebase.py） ===== */
  :root { --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  @media (max-width: 640px) {
    header { top:calc(var(--st) + 8px); }
    #langBtn { min-height:44px; }
    .mprimary { min-height:48px; border:1px solid #829700; border-radius:8px; background:var(--accent); color:var(--ink); font-weight:650; font-size:15px; cursor:pointer; padding:0 10px; }
    .mprimary[aria-pressed="true"] { background:var(--surface); color:var(--ink); border-color:var(--segline); }   /* 「取消选点」是退出操作：白底细框，不用深色块 */
    .mprimary:focus-visible, .tab:focus-visible, .mghost:focus-visible, #grab:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    .mghost { min-height:44px; padding:0 12px; border:1px solid var(--segline); border-radius:8px; background:var(--surface); font-size:13px; cursor:pointer; }
    .mghost.on { background:var(--accent); border-color:var(--accent); font-weight:650; }
    .mghost.add { border-style:dashed; color:var(--muted); background:var(--canvas); }
    /* 快捷视角格：等距 / 初始 / 1–3 */
    #mviews.quick { display:flex; gap:6px; }
    #mviews.quick .seg { background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); flex:1 1 auto; padding:0 8px; font-size:14px; min-height:44px; justify-content:center; }
    #mviews.quick .seg.on { background:var(--accent); box-shadow:none; }
    #mviews.quick .slotb { flex:0 0 44px; padding:0; font-variant-numeric:tabular-nums; }
    #mviews.quick .slotb.empty { background:var(--canvas); color:var(--muted); box-shadow:none; border:1px dashed var(--segline); }
    #mviews.quick .slotb.cur { box-shadow:inset 0 0 0 2px var(--ink); }
    #mviews.quick .div { width:1px; background:var(--line); margin:6px 0; flex:none; }
    /* 视角管理：一格一行，按钮写明（不靠长按或再点一次） */
    .vrows .row { display:flex; align-items:center; gap:8px; min-height:56px; border-top:1px solid var(--line); }
    .vrows .row:first-child { border-top:none; }
    .vrows .nm { flex:1; font-size:15px; }
    .vrows .nm small { display:block; font-size:12px; color:var(--muted); }
    #panel .actions { position:sticky; bottom:-16px; background:var(--surface); padding-bottom:14px; margin-bottom:-14px; }
  }

  @media (min-width: 641px) { #sheet, .attr-m { display:none; } }
  @media (max-width: 640px) {
    /* 方案 C：顶部只留标题和语言两个小浮块；图层、视角、署名全文、详情、导航结果都进一个可拖动的底部面板（收起 / 展开两档） */
    header { left:10px; right:10px; padding:0; background:none; border:none; pointer-events:none; }
    header .top { align-items:center; }
    header h1 { pointer-events:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:0 14px; height:54px; display:flex; align-items:center; font-size:18px; }
    header #lang { pointer-events:auto; }
    header #langBtn { height:54px; min-width:54px; border-radius:10px; font-size:15px; }   /* 和左侧标题浮块同高 */
    header .hub { display:none; }
    .attr-m { position:fixed; left:10px; bottom:calc(var(--sheetH, 170px) + 6px); font-size:11px; color:var(--muted); background:rgba(245,245,245,.88); padding:1px 6px; border-radius:4px; max-width:calc(100vw - 20px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; z-index:1; transition:bottom .25s; }
    #sheet { position:fixed; left:0; right:0; bottom:0; height:var(--sheetH, 170px); background:var(--surface); border-top:1px solid var(--line); border-radius:14px 14px 0 0; z-index:4; display:flex; flex-direction:column; transition:height .25s cubic-bezier(.2,.8,.2,1); }
    #sheet.dragging { transition:none; }
    #grab { flex:none; height:44px; margin-bottom:0; border:none; background:none; width:100%; cursor:grab; touch-action:none; display:flex; justify-content:center; padding-top:10px; }
    /* 把手触控区 44 px 整行，不再用负 margin 叠到下面的主按钮上（之前压住「导航到 C2」上沿 8 px） */
    #grab::before { content:""; width:40px; height:5px; border-radius:3px; background:var(--line); }
    #sheetBody { flex:1; overflow:auto; padding:0 14px calc(var(--sb) + 12px); overscroll-behavior:contain; }
    .peek { display:flex; flex-direction:column; gap:8px; padding-bottom:12px; }
    #views { display:none; }   /* 手机上桌面工具条隐藏，改用面板 */
    #mviews { position:static; transform:none; border:none; padding:0; background:none; max-width:none; overflow:visible; border-radius:0; }
    .more > section { padding:12px 0; border-top:1px solid var(--line); }
    .more h3 { margin:0 0 8px; font-size:15px; font-weight:650; }
    .more p, #attrSlot .attr { margin:0; font-size:13px; color:var(--muted); }
    #legendSlot .legend { margin:0; padding:0; border:none; }
    #sheet.lv0 .more, #sheet.lv0 #pc section { visibility:hidden; }
    #panel { position:relative; inset:auto; display:none; padding:0; border:none; width:auto; max-height:none; overflow:visible; border-radius:0; }
    #panel .x { right:-8px; top:-6px; }
    #panel .actions { position:sticky; bottom:calc(-12px - var(--sb)); margin:12px -14px 0; padding:12px 14px calc(12px + var(--sb)); }   /* 贴在底部面板底，半屏时也看得到 */
    #panel section:first-of-type { margin-top:12px; }
    body.card #home { display:none; }
    #hint { bottom:calc(var(--sheetH, 170px) + 30px); }
  }

  /* 指北针（camera-plan.md 方案 B）：细线圆钮，北针用品牌棕；≥900 右下角，641–899 右上角（详情卡在底部），手机在标题浮块下方右侧 */
  #compass { position:fixed; right:16px; bottom:16px; width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; cursor:pointer; padding:0; z-index:3; }
  #compass svg { display:block; }
  #compass:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  @media (max-width: 899px) { #compass { bottom:auto; top:16px; } }
  @media (max-width: 640px) { #compass { right:10px; top:calc(var(--st, 0px) + 8px + 54px + 10px); } }
  .lb.hit { touch-action:none; }   /* 标签上的手势交给画布（main.js 转发），不让浏览器拿去缩放页面 */
  #labels { -webkit-user-select:none; user-select:none; }   /* 从标签上开始拖动时不选中文字 */

  /* ===== 顶栏收紧（pollux 2026-11-20）：功能说明收进「?」；图层 6 个图标缩小一半，和「从机场 / 车站 / 口岸怎么来」并成两组工具；数据来源移到右下角 ===== */
  header .top { gap:8px; }
  /* 「?」和顶栏工具行的 6 个图层图标同尺幅：22 px 方角（pollux 2026-11-20）；手机档仍是 44 px */
  #helpBtn { margin-left:auto; flex:none; width:22px; height:22px; border-radius:5px; border:1px solid var(--segline); background:var(--surface); color:var(--muted); font-size:12px; font-weight:650; cursor:pointer; padding:0; line-height:1; }
  .tools #helpBtn { margin-left:-6px; }   /* 工具行间距 10 px、图标间距 4 px：「?」贴着图标，看起来是第 7 个 */
  #helpBtn[aria-expanded="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  #helpBtn:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  #help p { margin:6px 0 0; font-size:13px; color:var(--muted); }
  #help p.m { display:none; }
  @media (min-width: 641px) { header #help { position:absolute; left:-1px; right:-1px; top:calc(100% + 8px); z-index:2; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px 15px 10px; } }   /* 「?」说明浮在标题卡下方，不推动卡内已有内容（pollux 2026-11-20） */
  .tools { display:flex; align-items:center; gap:10px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .tools .legend { margin:0; padding:0; border:none; gap:4px; justify-content:flex-start; flex:none; }
  .tools .legend .seg.icon { width:22px; height:22px; min-height:22px; border-radius:5px; }
  .tools .legend .seg.icon svg { width:14px; height:14px; }
  .tools .sep { width:1px; height:18px; background:var(--line); flex:none; }
  .tools .tr-open { min-height:22px; padding:0 8px; border-radius:5px; background:var(--soft); text-decoration:none; font-size:12px; white-space:nowrap; }
  .tools .tr-open:hover { background:var(--seg); }
  body > .attr { position:fixed; right:16px; bottom:8px; margin:0; font-size:11px; color:var(--muted); background:rgba(245,245,245,.88); padding:1px 6px; border-radius:4px; max-width:calc(100vw - 32px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; z-index:1; }
  @media (min-width: 900px) { #compass { bottom:36px; } }   /* 给右下角的数据来源让位 */
  @media (max-width: 899px) and (min-width: 641px) { body > .attr { bottom:78px; } }   /* 底部工具条上方 */
  @media (max-width: 899px) and (min-width: 641px) { #panel { bottom:100px; } }   /* 详情卡再往上让出署名那一行，不压住数据来源（pollux 2026-11-20） */
  @media (max-width: 640px) {
    .attr-m { left:auto; right:10px; max-width:calc(100vw - 20px); }
    #helpBtn { pointer-events:auto; width:44px; height:44px; border-radius:10px; border-color:var(--line); font-size:18px; }
    #help { pointer-events:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px 12px 10px; margin-top:8px; }
    #help p.d { display:none; } #help p.m { display:block; }
    .tools { display:none; }   /* 手机：图层在底部面板里，交通入口也在面板里 */
  }

  /* 缩放三档 1x / 2x / 3x：和底部视角工具条并列，两个横向按钮组，样式同工具条（pollux 2026-11-20） */
  #bbar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:3; display:flex; gap:8px; align-items:stretch; max-width:calc(100vw - 32px); }
  #bbar #views { position:static; transform:none; left:auto; bottom:auto; max-width:none; min-width:0; flex:0 1 auto; }
  #zoomCtl { flex:none; display:flex; gap:6px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px; }
  #zoomCtl .seg { min-height:40px; min-width:44px; justify-content:center; background:var(--surface); color:var(--ink); font-variant-numeric:tabular-nums; }
  #zoomCtl .seg.on { background:var(--accent); color:var(--ink); font-weight:650; }
  /* ≥ 900：右下角只剩指北针，详情 / 交通卡左移让出这一列 */
  @media (min-width: 900px) { #panel { right:72px; } #bbar { bottom:36px; } }   /* 工具条抬到和指北针同一底线，让出最底下一行给右下角数据来源 */
  @media (max-width: 640px) {
    #bbar { display:contents; }   /* 手机：桌面工具条隐藏，缩放组搬进底部面板那一行 */
    #mqrow { display:flex; flex-wrap:wrap; gap:8px; align-items:stretch; }   /* 放不下（英文、很窄的屏）时缩放组折到下一行，不互相压住 */
    #mqrow #mviews { flex:1 1 auto; }
    #mqrow #mviews .seg { padding:0 6px; }
    #mqrow #zoomCtl { flex:1 0 auto; border:none; padding:0; background:none; gap:6px; }
    #mqrow #zoomCtl .seg { flex:1 0 38px; min-height:44px; padding:0 4px; font-size:14px; box-shadow:inset 0 0 0 1px var(--line); }
    #mqrow #zoomCtl .seg.on { box-shadow:none; }
  }

  /* 我的位置：黄底黑字圆角矩形头像（默认 makerX），下方小尖角指到所在位置的圆点（pollux 2026-11-20） */
  .me { position:absolute; width:0; height:0; pointer-events:none; }   /* 不建层叠上下文：框在楼号上层，圆点（.medot）在标签层最底下 */
  .medot { position:absolute; margin:-6px 0 0 -6px; width:12px; height:12px; border-radius:50%; background:#FFD400; border:2px solid #111; box-sizing:border-box; box-shadow:0 0 0 4px rgba(255,212,0,.35); pointer-events:none; }
  .mestem { position:absolute; width:2px; background:#111; pointer-events:none; }
  .me .av { position:absolute; z-index:3; background:#FFD400; color:#111; border:2px solid #111; border-radius:8px; padding:5px 9px; font-size:14px; font-weight:700; line-height:1; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.35); }
  /* 定位说明框（同品牌：白底、品牌棕标题、lime 主按钮；点礼物口袋时出现） */
  #geoAsk { position:fixed; inset:0; z-index:60; background:rgba(20,22,40,.55); display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  #geoAsk .card { width:min(400px, 100%); max-height:calc(100vh - 32px); overflow:auto; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:20px 20px 14px; box-sizing:border-box; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  #geoAsk .nmw { display:block; }
  #geoAsk .lb2 { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  #geoAsk input.ic { font:inherit; font-size:15px; font-weight:700; width:min(220px, 100%); box-sizing:border-box; min-height:40px; outline:none; }
  #geoAsk input.ic:focus-visible { box-shadow:0 0 0 3px rgba(109,52,37,.35); }
  .me .fk { margin-left:6px; font-size:11px; font-weight:650; background:#111; color:#FFD400; border-radius:4px; padding:1px 4px; vertical-align:1px; }
  .me .fk[hidden] { display:none; }
  #geoAsk .ic { display:inline-block; background:#FFD400; color:#111; border:2px solid #111; border-radius:8px; padding:5px 9px; font-size:14px; font-weight:700; line-height:1; }
  #geoAsk h2 { margin:12px 0 6px; font-size:19px; line-height:1.35; color:var(--brand); }
  #geoAsk .b { margin:0 0 10px; font-size:15px; line-height:1.55; }
  #geoAsk ul { margin:0 0 16px; padding-left:18px; font-size:14px; line-height:1.55; color:var(--muted); }
  #geoAsk li + li { margin-top:4px; }
  #geoAsk .act { display:flex; gap:8px; }
  #geoAsk .act button { flex:1; min-height:48px; border-radius:8px; font-size:15px; cursor:pointer; padding:0 10px; }
  #geoAsk .no { background:var(--surface); color:var(--ink); border:1px solid var(--segline); }
  #geoAsk .yes { background:var(--accent); color:var(--ink); border:1px solid #829700; font-weight:650; }
  #geoAsk button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  #geoAsk .ft { margin:10px 0 0; font-size:12px; color:var(--muted); text-align:center; }
  /* 不在会场 1 km 内的提示：桌面在底部工具条上方，手机在底部面板上方 */
  #meFar { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:6; display:flex; gap:12px; align-items:center; width:min(440px, calc(100vw - 32px)); box-sizing:border-box; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-left:6px solid #FFD400; border-radius:10px; padding:10px 10px 10px 14px; font-size:14px; line-height:1.45; box-shadow:0 4px 16px rgba(0,0,0,.3); transition:opacity .3s; }
  #meFar.out { opacity:0; }
  #meFar .x { flex:none; min-height:40px; padding:0 12px; border-radius:8px; border:1px solid var(--segline); background:var(--surface); color:var(--ink); font-size:13px; cursor:pointer; }
  @media (min-width: 900px) { #meFar { bottom:116px; } }
  @media (max-width: 899px) and (min-width: 641px) { #meFar { bottom:112px; } }   /* 平板：数据来源在工具条上方，提示再往上让开 */
  @media (max-width: 640px) { #meFar { width:calc(100vw - 20px); bottom:calc(var(--sheetH, 170px) + 34px); } }
  .me.mine .av { z-index:4; }
  .me.mine .av { pointer-events:auto; cursor:pointer; }
  .me:not(.mine) .av { font-size:12px; padding:4px 7px; opacity:.92; }   /* 别人的头像略小，自己的在最上层 */
  .me .medel { position:absolute; left:50%; top:calc(100% + 6px); transform:translateX(-50%); font-weight:400; z-index:4; pointer-events:auto; white-space:nowrap; min-height:40px; padding:0 12px; border-radius:8px; border:1px solid var(--segline); background:var(--surface); color:var(--ink); font-size:13px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .me .medel[hidden] { display:none; }

  /* ===== 手机：左上角下拉 picker（图层 / 交通），pollux 2026-11-20 ===== */
  #mpick { display:none; }
  @media (max-width: 640px) {
    #mpick { display:flex; gap:8px; position:fixed; left:10px; top:calc(var(--st, 0px) + 8px + 54px + 10px); z-index:5; }
    .pkw { position:static; }   /* 菜单以 #mpick 定位，两个菜单都从左边对齐，不伸出屏幕 */
    .pk { height:44px; display:inline-flex; align-items:center; gap:6px; padding:0 10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; white-space:nowrap; }
    .pk .n { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .pk .ic { display:inline-flex; } .pk .ic:empty { display:none; }
    .pk .cv { color:var(--muted); transition:transform .15s; }
    .pk[aria-expanded="true"] { border-color:var(--ink); }
    .pk[aria-expanded="true"] .cv { transform:rotate(180deg); }
    .pk.sel { background:var(--accent); border-color:#829700; }   /* 已选某一组交通：选中态用 lime */
    .pk.sel .cv { color:var(--ink); }
    .pk:focus-visible, .pkmenu .row:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    .pkmenu { position:absolute; left:0; top:52px; width:max-content; min-width:252px; max-width:calc(100vw - 20px); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px; }
    .pkmenu .hd { font-size:12px; color:var(--muted); padding:6px 10px 4px; }
    .pkmenu .sep { height:1px; background:var(--line); margin:4px 10px; }
    .pkmenu .row { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 10px; border:none; background:none; border-radius:8px; font:inherit; font-size:15px; color:var(--ink); text-align:left; cursor:pointer; }
    .pkmenu .row:active { background:var(--soft); }
    .pkmenu .row > svg:first-child, .pkmenu .row .gi { flex:none; display:inline-flex; }
    .pkmenu .row .nm { flex:1; }
    .pkmenu .row .nm small { display:block; font-size:12px; color:var(--muted); }
    .pkmenu .ck { flex:none; width:22px; height:22px; border-radius:6px; border:1.5px solid var(--segline); display:grid; place-items:center; color:transparent; }
    .pkmenu .row[aria-checked="true"] .ck { background:var(--ink); border-color:var(--ink); color:#fff; }
    .pkmenu .row.emph[aria-checked="true"] .ck { background:var(--brand); border-color:var(--brand); }
    .pkmenu .row[aria-checked="false"]:not(.emph) { color:var(--muted); }
    .pkmenu .row[aria-checked="false"]:not(.emph) > svg:first-child { opacity:.35; }
    .pkmenu .row .go { flex:none; color:var(--muted); font-size:18px; }
    .pkmenu .row[aria-current="true"] { background:var(--accent); }
    body.help-open #mpick .pkw { visibility:hidden; }
    /* 底部面板里原来的「图层」「交通」两节由 picker 取代，手机上不再重复 */
    .more > section:has(#legendSlot), .more > section.trsec { display:none; }
  }
  /* 编号引线：细直线 + 楼端小圆点，画在标签下面 */
  #leaders { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  #leaders line { stroke:var(--muted); stroke-width:1; }
  #leaders circle { fill:var(--muted); }

  /* ===== 昼夜（oct-loft-daynight，pollux 2026-11-20 选「A 月光蓝 + 浅色 UI」）：标题栏小按钮显示深圳时间和昼夜，点开「自动 / 白天 / 夜间」；UI 卡片保持浅色 ===== */
  #dn { display:inline-flex; flex-direction:column; justify-content:center; align-items:flex-start; margin-left:auto; flex:none; height:36px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:12px; line-height:1.2; font-variant-numeric:tabular-nums; cursor:pointer; white-space:nowrap; }
  #dn .tm { display:inline-flex; align-items:center; gap:4px; font-weight:650; }
  #dn .s { font-size:11px; color:var(--muted); }
  #dn .cs { display:none; }   /* 手机英文版标题行放不下「Shenzhen」，换成「SZ」 */
  @media (max-width: 640px) { #dn .cl { display:none; } #dn .cs { display:inline; } }
  #dn:hover { background:var(--soft); }
  #dn:focus-visible, #dnMenu button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  header .top #dn ~ #helpBtn { margin-left:0; }
  #dnMenu { position:fixed; z-index:6; display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px; }
  #dnMenu[hidden] { display:none; }
  #dnMenu button { border:none; min-height:36px; padding:0 12px; border-radius:7px; background:none; color:var(--ink); font-size:13px; cursor:pointer; }
  #dnMenu button:hover { background:var(--soft); }
  #dnMenu button.on { background:var(--accent); color:var(--ink); font-weight:650; }
  @media (max-width: 640px) { #dn { pointer-events:auto; height:54px; border-radius:10px; font-size:13px; padding:0 9px; } #dnMenu button { min-height:44px; } body.help-open #dnMenu { display:none; } }
  /* 夜间：画布上的楼号、路名反白 + 深色描边；C2 标签、强调模式标签、选中标签都有自己的底色，不动 */
  body.night:not(.emph) .lb.loft:not(.c2):not(.sel) { color:#f6f4ef; text-shadow:0 0 3px #2b3549,0 0 3px #2b3549,0 0 4px #2b3549; }
  body.night .lb.road { color:#c3cbdc; text-shadow:0 0 3px #2b3549,0 0 3px #2b3549; }
  body.night > .attr, body.night .attr-m { background:rgba(245,245,245,.92); }

  /* ===== 右上角模组（pollux 2026-11-20 选 A）：深圳时间 / 昼夜、语种、指北针并成一块，一列三格细线分隔；桌面 / 平板 / 手机都在右上角 ===== */
  #trm { position:fixed; top:16px; right:16px; z-index:5; display:flex; align-items:center; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  #trm > #dn, #trm #langBtn, #trm > #compass { position:relative; inset:auto; margin:0; height:44px; min-height:44px; border:none; background:none; border-radius:7px; }
  #trm > #dn:hover, #trm #langBtn:hover, #trm > #compass:hover { background:var(--soft); }
  #trm #langBtn { min-width:44px; }
  #trm > #compass { width:44px; display:grid; }
  #trm > #lang, #trm > #compass { margin-left:9px; }
  /* 膠囊外形 + 圆形指北针（pollux 2026-11-20 看图选定） */
  #trm { border-radius:28px; padding:4px 4px 4px 6px; }
  #trm > #dn { flex-direction:row; align-items:center; gap:6px; padding:0 10px; border-radius:22px; font-size:15px; }
  #trm > #dn .tm { gap:5px; } #trm > #dn .tm svg { width:15px; height:15px; }
  #trm > #dn .au { font-size:11px; font-weight:600; color:var(--muted); background:var(--soft); border-radius:4px; padding:1px 5px; }
  #trm #langBtn { border-radius:22px; }
  #trm > #compass { border:1px solid var(--line); border-radius:50%; background:var(--canvas, #f5f5f5); }
  #trm > #lang::before, #trm > #compass::before { content:""; position:absolute; left:-5px; top:8px; bottom:8px; width:1px; background:var(--line); }
  #trm > #lang { position:relative; }
  @media (max-width: 369px) { #trm > #dn .au { display:none; } }   /* 360 宽小屏放不下「自动」小字，点开菜单仍可见 */
  @media (min-width: 641px) and (max-width: 899px) { header { width:min(420px, calc(100vw - 290px)); } }   /* 平板：标题卡让出右上角模组 */
  @media (min-width: 900px) { #panel { top:86px; right:16px; max-height:calc(100vh - 86px - 100px); } }   /* 详情卡让出右上角模组 */

<script type="module">
const buildOCAT = (() => {
// OCAT 两栋构件级模型（方案 B，pollux 2026-11-20 选定）。依据与尺寸见 figures/oct-loft/ocat-models.md
// 用法：import { buildOCAT } from "./ocat.js";  const g = buildOCAT(THREE, b);  // b = data.json 里 name 为 B10 / F2 的楼
// 返回 THREE.Group（已放到世界坐标），不认识的楼返回 null。坐标约定同 main.js：ring 为 [x, z]，x 向东、z 向南、y 向上。
// 局部坐标：原点 = 楼的西北角，X 向东、Z 向南（同 URBANUS 平面图，北朝上），单位 m；按 OSM 轮廓做仿射拉伸，保证和地图上的轮廓严丝合缝。

const COL = {
  white: 0xffffff,      // 白色抹灰体量（同 main.js matLoft）
  deck: 0xe6e2dd,       // 屋顶露天展厅地面
  mesh: 0x4a4744,       // 深灰拉伸金属网
  shade: 0x8d867f,      // 凹入入口的阴影面
  shed: 0xf3f1ee,       // F2 库房墙
  roof: 0xd6d1cb,       // F2 坡屋面
  paint: 0x201f1c,      // F2 山墙上刷的黑字
  wood: 0xb08a63,       // F2 门前木平台
  edge: 0xb9b1aa,       // 边线（同 main.js edgeMat）
};

// 平面图量得的外轮廓（m），用于把局部坐标拉伸到 OSM 轮廓
const SPEC = {
  B10: { w: 54.8, d: 48.9 },
  F2: { w: 52.1, d: 27.2 },
};

function buildOCAT(THREE, b) {
  if (!b || !SPEC[b.name]) return null;
  const PO = { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 };
  const M = {};
  const mat = (k, extra = {}) => (M[k + JSON.stringify(extra)] ||= new THREE.MeshLambertMaterial({ color: COL[k], side: THREE.DoubleSide, ...PO, ...extra }));
  const edgeMat = new THREE.LineBasicMaterial({ color: COL.edge });
  const g = new THREE.Group();
  g.name = `ocat-${b.name}`;

  // ---- 小工具：都在局部坐标里画 ----
  const addMesh = (geo, k, extra, { edges = true, shadow = true } = {}) => {
    const m = new THREE.Mesh(geo, mat(k, extra));
    m.castShadow = shadow; m.receiveShadow = true;
    g.add(m);
    if (edges) g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), edgeMat));
    return m;
  };
  // 立方体：x0..x1 × y0..y1 × z0..z1
  const box = (x0, x1, y0, y1, z0, z1, k = "white", opt) => {
    const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
    geo.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    return addMesh(geo, k, {}, opt);
  };
  // 竖向墙板（可带镂空字母）：沿局部轴放置。axis = "x"（墙面朝南北，沿 X 延伸）或 "z"（墙面朝东西，沿 Z 延伸）
  // a0..a1 = 沿墙长度方向的范围，y0..y1 = 高度，c = 墙所在的另一坐标，t = 厚度，holes = [[shape 生成函数, 中心 a, 中心 y, 尺寸]]
  const panel = (axis, a0, a1, y0, y1, c, t, k, extra, holes = [], flip = false) => {
    const s = new THREE.Shape([new THREE.Vector2(a0, y0), new THREE.Vector2(a1, y0), new THREE.Vector2(a1, y1), new THREE.Vector2(a0, y1)]);
    for (const h of holes) s.holes.push(...h);
    const geo = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 24 });
    geo.translate(0, 0, -t / 2);
    if (axis === "x") { if (flip) geo.scale(-1, 1, 1), geo.translate(a0 + a1, 0, 0); geo.translate(0, 0, c); }
    else { geo.rotateY(-Math.PI / 2); if (flip) geo.scale(1, 1, -1), geo.translate(0, 0, a0 + a1); geo.translate(c, 0, 0); }
    return addMesh(geo, k, extra);
  };

  // 「OCAT」四个字形（圆 / C / 三角 / T），作为墙板上的孔或单独的平面。cx = 字中心在墙长度方向的坐标，cy = 字中心高度，h = 字高
  // dir = +1 时字母从小坐标往大坐标排（从墙外看要正读，由调用方按朝向给 dir；南、西两面都是 +1，北、东两面是 -1）
  const glyphs = (start, cy, h, gap, dir) => {
    const out = [], r = h / 2, seg = 40;
    let x = start;
    const circle = (cx, cy0, rr, a0 = 0, a1 = Math.PI * 2) => { const p = new THREE.Path(); p.absarc(cx, cy0, rr, a0, a1, false); return p; };
    // O：实心圆孔
    out.push([circle(x + dir * r, cy, r)]); x += dir * (2 * r + gap);
    // C：圆环去掉右侧 70°（从墙外看开口朝右；dir=-1 时墙板已翻转，同样正读）
    { const cx = x + dir * r, ro = r, ri = r * 0.5, open = (35 * Math.PI) / 180, base = dir > 0 ? 0 : Math.PI; const p = new THREE.Path();
      p.absarc(cx, cy, ro, base + open, base + Math.PI * 2 - open, false);
      p.absarc(cx, cy, ri, base + Math.PI * 2 - open, base + open, true); p.closePath(); out.push([p]); x += dir * (2 * r + gap); }
    // A：实心三角
    { const w = h * 0.95, x0 = x, x1 = x + dir * w; const p = new THREE.Path();
      p.moveTo(x0, cy - r); p.lineTo(x1, cy - r); p.lineTo((x0 + x1) / 2, cy + r); p.closePath(); out.push([p]); x += dir * (w + gap); }
    // T：横 + 竖
    { const w = h * 0.8, bar = h * 0.24, stem = h * 0.3, x0 = x, x1 = x + dir * w, xm = (x0 + x1) / 2; const lo = Math.min(x0, x1), hi = Math.max(x0, x1);
      const p = new THREE.Path(); p.moveTo(lo, cy + r); p.lineTo(hi, cy + r); p.lineTo(hi, cy + r - bar); p.lineTo(xm + stem / 2, cy + r - bar);
      p.lineTo(xm + stem / 2, cy - r); p.lineTo(xm - stem / 2, cy - r); p.lineTo(xm - stem / 2, cy + r - bar); p.lineTo(lo, cy + r - bar); p.closePath(); out.push([p]); }
    return out;
  };

  // 只在赞助商模式里显示（pollux 2026-11-21）：口袋开着，或从口袋点了「在地图上看」正看着某一家时刷上；关掉口袋 / 取消选中就收回，平时 C2 周边不涂装
  // 刷上：各栋错开 120 ms、0.9 s 强缓出；收回：0.5 s 一起退
  let popAt = 0, popLast = 0, popWas = false;
  function modeNote(on) {
    document.getElementById("spNote")?.remove();
    const el = document.createElement("div"); el.id = "spNote"; el.setAttribute("role", "status");
    el.innerHTML = `<span class="tx">${on ? `<b>${t("spModeOnT")}</b>${t("spModeOn")}` : t("spModeOff")}</span><button type="button" class="ok">${t("spOk")}</button>`;
    el.querySelector(".ok").onclick = () => { el.classList.add("out"); setTimeout(() => el.remove(), 250); };
    document.body.appendChild(el);
    // 「不在场内」提示也在时，叠在它上面，不互相盖住
    placeNote();
  }
  // 手机：贴在顶部控件（标题、图层 / 交通行、昼夜胶囊、指北针）下面；桌面：「不在场内」提示也在时叠在它上面
  function placeNote() {
    const el = document.getElementById("spNote"); if (!el) return;
    if (MOBILE) {
      const top = Math.max(0, ...["header", "#mpick", "#dn", "#compass", "#lang"].map((q) => { const e = document.querySelector(q); const r = e && shown(e); return r && r[1] < innerHeight / 2 ? r[3] : 0; }));
      el.style.setProperty("--spNoteTop", (top + 8) + "px"); el.style.bottom = "";
    } else { const f = document.getElementById("meFar"); el.style.bottom = f ? (innerHeight - f.getBoundingClientRect().top + 8) + "px" : ""; }
  }
  const popActive = () => isOpen || !!focusSp;
  function popTick(now) {
    const dt = popLast ? Math.min(64, now - popLast) : 16; popLast = now;
    const on = popActive(), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (on !== popWas) { popWas = on; modeNote(on); }   // 礼物模式打开 / 关闭各提醒一次
    if (on && !popAt) popAt = now; if (!on) popAt = 0;
    POP.forEach((p, i) => {
      p.k = p.k || 0;
      if (reduce) p.k = on ? 1 : 0;
      else if (on) { if (now - popAt > i * 120) p.k = Math.min(1, p.k + dt / 900); }
      else p.k = Math.max(0, p.k - dt / 500);
      const e = on ? 1 - Math.pow(1 - p.k, 3) : p.k * p.k;
      p.shell.scale.y = Math.max(0.001, e);
      if (p.word) p.word.material.opacity = Math.min(1, Math.max(0, (p.k - 0.7) / 0.3));
      // 点选这栋楼时涂装让开（露出 lime 选中高亮），取消选中后回来
      const show = p.k > 0.002 && sel !== p.m; p.shell.visible = show; if (p.word) p.word.visible = show;
    });
    requestAnimationFrame(popTick);
  }
  requestAnimationFrame(popTick);
  window.__spPop = () => POP.map((p) => [p.s.popup, p.shell.visible, +p.shell.scale.y.toFixed(2)]);   // 自查用
  // 赞助商视角（pollux 2026-11-20：默认 2x）：打开口袋时如果比 2x 远，就拉到 2x，并把几栋快闪店楼放到可用画面中间；已经在 2x / 3x 不动
  function sponsorView() {
    if (!POP.length || zoomRatio() > 1.9) return;
    const pts = POP.map((p) => { const [x, z] = centroid(p.m.userData.b.ring); return new THREE.Vector3(x, p.m.userData.b.h, z); });
    requestAnimationFrame(() => {   // 等口袋 / 面板就位后再按可用画面取景
      const iso = isoLocked;
      // 桌面口袋浮层在左下：取景时把它占的那一条让出来，快闪店楼落在口袋右边的画面中间
      let rect = safeRect(); const o = !MOBILE && !ov.closest("#sheet") && shown(ov);
      if (o) rect = { ...rect, left: Math.max(rect.left, o[2] + 16) };
      goTo({ ...frame(pts, iso ? lockDir() : curDir(), iso ? ISO_FOV : baseFov, { rect, dist: fitDist() / 2, pad: 0 }), iso }, 700);
    });
  }

  // ---------- 口袋面板 ----------
  const ov = document.createElement("section"); ov.className = "sp-ov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "false");
  document.body.appendChild(ov);
  let isOpen = false, tab = "all", view = "list", cur = null, busy = false, lastGot = null, flash = null;   // tab = all / mine；view = list / detail / id（身份确认）/ got（刚领到）；cur = 详情页的赞助商
  function closePocket(keepLevel) {
    if (!isOpen) return;
    isOpen = false; busy = false; ov.classList.remove("on"); document.body.classList.remove("sp-open", "sp-in-sheet");
    if (ov.closest("#sheet")) { document.body.appendChild(ov); if (!keepLevel) setLevel(0); }
    updateEntry();
  }
  function openPocket(tb = "all", detailId = null) {
    if (sel) selectRaw(null);
    if (typeof setPicking === "function" && picking) setPicking(false);
    if (!detailId || detailId !== focusSp) focusSp = null;   // 回到正在地图上看的那一家时，地图标记保留
    sponsorView();
    isOpen = true; tab = tb; cur = SPS.find((x) => x.id === detailId) || null; view = cur ? "detail" : "list"; ov.classList.add("on"); document.body.classList.add("sp-open");
    if (MOBILE) { sheetBody.prepend(ov); document.body.classList.add("sp-in-sheet"); setLevel(1); sheetBody.scrollTop = 0; }
    render(); updateEntry();
    requestAnimationFrame(() => (ov.querySelector(".sp-tabs [aria-selected=true]") || ov.querySelector(".sp-top button"))?.focus({ preventScroll: true }));
  }
  // 桌面：口袋最高到顶栏下沿（顶栏高度随语言、换行变化），超出就在口袋里滚动，不压顶栏
  // 底部工具条变宽（英文、存了视角）伸到左下时，口袋和面板一起抬到工具条上方
  const viewsTop = (el) => { if (MOBILE) return null; const v = shown(document.getElementById("views")); if (!v) return null; const r = el.getBoundingClientRect(); return v[0] < 16 + Math.max(r.width, el === ov ? 340 : 96) + 8 ? innerHeight - v[1] + 8 : null; };
  function fitOv() {
    if (ov.closest("#sheet")) { ov.style.maxHeight = ov.style.height = ov.style.bottom = ""; return; }
    const b = viewsTop(ov); ov.style.bottom = b ? b + "px" : "";
    // 列表、礼物详情、身份确认、领取动画用同一个固定高度（pollux：两者高度一致，不要因高度不同跳动）；内容在里面滚动，底部操作栏贴底
    const h = document.querySelector("header").getBoundingClientRect().bottom; ov.style.height = ov.style.maxHeight = Math.min(640, Math.max(240, innerHeight - (b || 16) - h - 12)) + "px";
  }
  function fitEntry() { const b = viewsTop(entry); entry.style.bottom = b ? b + "px" : ""; }
  addEventListener("resize", () => { fitEntry(); placeNote(); if (isOpen) fitOv(); });

  let pendingClaim = null;
  ov.addEventListener("click", (e) => {
    if (busy) return;
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset, find = (id) => SPS.find((x) => x.id === id);
    if (b.classList.contains("x")) { resume = null; focusSp = null; closePocket(); return; }   // × = 离开赞助商模式：标记和快闪店涂装都收起
    if (d.tab) { tab = d.tab; view = "list"; render(); return; }
    if (d.open) { cur = find(d.open); view = "detail"; render(); return; }
    if ("back" in d) { view = view === "id" ? "detail" : "list"; pendingClaim = null; render(); return; }
    if (d.go) { flyTo(d.go); return; }
    if ("fake" in d) { fakePresence(); return; }
    if (d.claim) { if (!canClaim()) return; const s = find(d.claim); if (!st.verified) { pendingClaim = s; view = "id"; render(); } else doClaim(s); return; }
    if ("idok" in d) { api.verify().then(() => { const p = pendingClaim; pendingClaim = null; if (p) doClaim(p); else { view = "list"; render(); } }); return; }
    if ("reset" in d) { api.reset(); tab = "all"; view = "list"; render(); updateEntry(); return; }
  });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && isOpen) { resume = null; focusSp = null; closePocket(); entry.focus({ preventScroll: true }); } });

  function doClaim(s) {
    busy = true;
    api.claim(s).then((ok) => {
      if (!ok) { busy = false; view = "detail"; render(); return; }
      lastGot = s; view = "got"; render(); updateEntry();
      const stg = ov.querySelector(".sp-stage"), c = stg.querySelector(".sp-card");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      // 卡从口袋升起（0.8 s）→ 翻面、口袋收成一条（0.7 s）→ 停 1 s 让人看清 → 自动切到「我的」（pollux：领取成功后状态更新为自己可用的权益）
      requestAnimationFrame(() => requestAnimationFrame(() => {
        c.classList.add("up");
        setTimeout(() => { c.classList.add("flip"); stg.classList.add("out"); }, reduce ? 0 : 650);
        setTimeout(() => { busy = false; if (!isOpen || view !== "got") return; flash = s; tab = "mine"; view = "list"; render(); ov.querySelector(".sp-tabs [aria-selected=true]")?.focus({ preventScroll: true }); }, reduce ? 300 : 2450);
      }));
    });
  }

  const ICO = {
    back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
    pin: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><path d="M12 12.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>',
    net: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18v2"/></svg>',
    gift: GIFT.replace('width="14" height="14"', 'width="28" height="28"'),
  };
  const ebOf = (s) => s.no1 ? t("spNo1") : t("spSp");
  const giftList = (s) => { const g = tx(s.gifts) || []; return `<ol class="${g.length > 1 ? "" : "one"}">${g.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>`; };
  // 列表行（UI規範.md 5.3）：左 88px 方块（No.1 lime 底）+ 下沿压本人状态胶囊；右眉题 / 标题 / 礼品、位置 · 剩余 / 标签；整行进详情，不放行尾箭头和行内按钮
  function row(s) {
    const r = api.remaining(s), g = tx(s.gifts) || [];
    return `<li class="sp-it"><button type="button" data-open="${s.id}" aria-label="${esc(t("spOpen", nm(s)))}">`
      + `<span class="sp-th"><i class="${s.no1 ? "no1" : ""}">${ICO.gift}</i>${isMine(s) ? `<span class="sp-pill">${t("spClaimed")}</span>` : ""}</span>`
      + `<span class="sp-info"><span class="sp-eb">${ebOf(s)}</span><span class="sp-ti">${esc(nm(s))}</span>`
      + `<span class="sp-mt">${esc(g.join(" · "))}<br>${whereShort(s)} · ${r ? t("spLeft", r, s.stock) : t("spOut")}</span>`
      + (s.placeholder ? `<span class="sp-tags"><span class="sp-tag">${t("spPh")}</span></span>` : "")
      + `</span></button></li>`;
  }
  // ---------- 现场确认（pollux 2026-11-20）：点开礼物卡片时才请求定位（每次打开页面只请求一次），不在打开页面时就问 ----------
  // 定位由 main.js 的 window.octPresence 提供（视角会话实现）：request() 真定位 → near / far / denied / error；fake() 假装在现场（不上传）
  // 只有真实在现场（near 且不是假装）才能领取；假装在现场时「领取」停用，提示「你只是在假装在现场哦！~」
  let pres = { status: null, fake: false }, presAsked = false;
  const presRefresh = () => { if (isOpen && view === "detail") render(); };
  function askPresence() {
    if (presAsked) return; presAsked = true;
    const P = window.octPresence;
    if (!P?.request) { pres = { status: "none", fake: false }; return; }
    pres = { status: "checking", fake: false };
    Promise.resolve().then(() => P.request()).then((r) => { if (!pres.fake) pres = { status: r?.status || "error", fake: !!r?.fake }; presRefresh(); updateEntry(); }, () => { if (!pres.fake) pres = { status: "error", fake: false }; presRefresh(); });
  }
  function fakePresence() {
    const P = window.octPresence;
    const done = (r) => { pres = { status: r?.status || "near", fake: true }; presRefresh(); };
    if (P?.fake) Promise.resolve().then(() => P.fake()).then(done, () => done(null)); else done(null);
  }
  const canClaim = () => pres.status === "near" && !pres.fake;
  function onsite(s) {
    if (isMine(s)) return "";
    const msg = pres.fake ? `<p class="sp-fake" role="status">${t("spFake")}</p><p class="sp-note">${t("spFakeNote")}</p>`
      : `<p class="sp-pres ${pres.status === "near" ? "ok" : ""}" role="status">${t({ checking: "spChecking", near: "spNear", far: "spFar", denied: "spDenied", error: "spErr", none: "spNone" }[pres.status] || "spChecking")}</p>`;
    const btn = pres.fake || canClaim() ? "" : `<button type="button" class="sp-btn ghost wide" data-fake>${t("spFakeBtn")}</button>`;
    return `<section class="sp-sec"><h4>${t("spOnsiteT")}</h4>${msg}${btn}</section>`;
  }
  function detail(s) {
    const r = api.remaining(s), mine = isMine(s);
    let h = `<div class="sp-dh"><div class="sp-eb">${ebOf(s)}</div><h3>${esc(nm(s))}</h3><div class="sp-mt">${r ? t("spLeft", r, s.stock) : t("spOut")}${s.note ? ` · ${esc(tx(s.note))}` : ""}</div>`
      + `<div class="sp-tags">${mine ? `<span class="sp-pill">${t("spClaimed")}</span>` : ""}${s.placeholder ? `<span class="sp-tag">${t("spPh")}</span>` : ""}</div></div>`;
    h += onsite(s);
    h += `<section class="sp-sec"><h4>${t("spGift")}</h4>${giftList(s)}</section>`;
    h += `<section class="sp-sec"><h4>${t("spLoc")}</h4><button type="button" class="sp-loc" data-go="${s.id}">${s.claim ? ICO.net : ICO.pin}<span><b>${s.claim ? t("spOnline") : t("spBldg", s.at)}</b><small>${s.claim ? t("spOnlineSub") : t("spShow")}</small></span><span class="sp-chev">${ICO.chev}</span></button></section>`;
    if (s.claim) h += `<section class="sp-sec"><h4>${t(mine ? "spUse" : "spWhere")}</h4><p>${esc(tx(s.claim))}</p>${mine ? `<div class="sp-qrrow"><span class="sp-qr">${s.qr ? `<img src="${s.qr}" alt="">` : t("spQr")}</span><span>${s.note ? esc(tx(s.note)) : ""}</span></div>` : ""}</section>`;
    return h;
  }
  function render() {
    if (view === "detail") askPresence();
    const n = SPS.length, m = st.mine.length;
    ov.setAttribute("aria-label", t("spPocket"));
    const sub = view === "detail" || view === "id";
    const title = view === "detail" ? t("spDetailT") : view === "id" ? t("spIdT") : t("spPocket");
    let h = `<div class="sp-top">${sub ? `<button type="button" data-back>${ICO.back}${t("spBackTx")}</button>` : "<span></span>"}<h2>${title}</h2><button type="button" class="x" aria-label="${t("spClose")}">×</button></div><div class="sp-body">`;
    let bar = "";
    if (view === "list") {
      if (flash && tab === "mine") h += `<p class="sp-flash" role="status"><b>${t("spGotT")}</b>${t("spGotTx", api.remaining(flash), flash.stock)}</p>`;
      h += `<div class="sp-tabs" role="tablist">${[["all", `${t("spAll")} ${n}`], ["mine", `${t("spMine")} ${m}`]].map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>`;
      const list = tab === "mine" ? SPS.filter(isMine) : SPS;
      h += `<p class="sp-count">${tab === "mine" ? t("spMineCount", list.length) : t("spCount", list.length)}</p>`;
      h += list.length ? `<ul class="sp-list">${list.map(row).join("")}</ul>` : `<p class="sp-msg">${t("spEmpty")}</p>`;
      if (tab === "mine" && !list.length) bar = `<div class="sp-bar"><button type="button" class="sp-btn" data-tab="all">${t("spGoAll")}</button></div>`;
    } else if (view === "detail") {
      const s = cur, r = api.remaining(s), mine = isMine(s);
      h += detail(s);
      // 底部固定栏：左方形次操作（在地图上看）+ 右 lime 主操作（领取）
      bar = `<div class="sp-bar"><button type="button" class="sp-btn ghost sq" data-go="${s.id}" aria-label="${t("spShow")}" title="${t("spShow")}">${ICO.pin}</button>`
        + (mine ? `<button type="button" class="sp-btn" disabled>${t("spClaimed")}</button>` : r ? `<button type="button" class="sp-btn" data-claim="${s.id}"${canClaim() ? "" : " disabled"}>${t("spClaim")}</button>` : `<button type="button" class="sp-btn" disabled>${t("spOut")}</button>`) + `</div>`;
    } else if (view === "id") {
      h += `<p class="sp-msg">${t("spIdTx")}</p>`;
      bar = `<div class="sp-bar"><button type="button" class="sp-btn ghost" data-back>${t("spCancel")}</button><button type="button" class="sp-btn" data-idok>${t("spIdOk")}</button></div>`;
    } else if (view === "got") {
      const s = lastGot;
      h += `<div class="sp-stage"><div class="sp-card"><div class="in"><div class="bk" aria-hidden="true"></div><div class="f">${face(s, false)}</div></div></div><div class="lip" aria-hidden="true">${t("spPocket")}</div></div>`;
    }
    if (view === "list") h += `<p class="sp-foot"><span>${t("spProto")}</span><button type="button" data-reset>${t("spReset")}</button></p>`;
    h += `</div>` + bar;
    const key = view + tab + (cur?.id || ""), newView = ov.dataset.view !== key; ov.dataset.view = key;
    ov.innerHTML = h; fitOv();
    if (newView) { ov.scrollTop = 0; if (ov.closest("#sheet")) sheetBody.scrollTop = 0; }   // 换视图回到顶部
    if (view === "got" && !busy) { const stg = ov.querySelector(".sp-stage"); stg.classList.add("out"); stg.querySelector(".sp-card").classList.add("up", "flip"); }
    if (!(view === "list" && tab === "mine")) flash = null;
  }

  // ---------- 入口 ----------
  const entry = document.createElement("button"); entry.type = "button"; entry.className = "sp-pk";
  document.body.appendChild(entry);
  function updateEntry() {
    const n = SPS.length, m = st.mine.length;
    entry.innerHTML = `<span class="cd"></span><span class="cd"></span><span class="cd"></span><span class="bag">${t("spPocket")}<small>${t("spBag", n, m)}</small></span>`;
    entry.setAttribute("aria-label", t("spOpenAria", n, m)); entry.setAttribute("aria-expanded", String(isOpen));
  }
  let resume = null;   // 「在地图上看」收起口袋时记下的分页和礼物详情；按 × / Esc 主动关掉就清掉
  entry.onclick = () => { if (isOpen) { resume = null; focusSp = null; closePocket(); } else openPocket(resume?.tab || "all", resume?.id || null); };
  updateEntry(); requestAnimationFrame(fitEntry);
  new MutationObserver(() => requestAnimationFrame(() => { fitEntry(); if (isOpen) fitOv(); })).observe(document.getElementById("views"), { childList: true, subtree: true, characterData: true });

  // 打开详情卡（点楼、方位标、交通卡）时收起口袋；两者不同时出现
  const selectRaw = select;
  select = function (o) { if (o && isOpen) closePocket(true); if (o !== wwObj) focusSp = null; selectRaw(o); };
  new MutationObserver(() => { if (isOpen && panel.style.display === "block") closePocket(true); }).observe(panel, { attributes: true, attributeFilter: ["style"] });
  // 跨 640px（转屏、改窗口）：口袋跟着换位置
  MQ.addEventListener("change", () => { if (isOpen) { const tb = view === "got" ? "mine" : tab, id = view === "detail" ? cur?.id : null; closePocket(true); openPocket(tb, id); } });
  // 切换语言：入口、标记、面板按新语言重画
  document.getElementById("langBtn").addEventListener("click", () => requestAnimationFrame(() => { updateEntry(); fitEntry(); if (document.getElementById("spNote")) modeNote(popWas); if (isOpen) { if (view === "got") { view = "list"; tab = "mine"; } if (view === "id") view = "detail"; render(); } }));
}

</script>
</body>

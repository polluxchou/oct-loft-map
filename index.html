<!doctype html>
<!-- 生成文件：改 web/src/template.html、web/src/main.js 后跑 node build-web.mjs -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCT-LOFT 3D 场地地图</title>
<style>
  /* 字体、配色、组件形态对齐 muShenzhen M2 原型（prototype/DESIGN.md 与 structure-*.css 的 token）：
     canvas #f5f5f5 / surface #fff / ink #201f1c / muted #5a514a / line #d8d1cb / soft #eeeae6 / accent #dfff2f / brand #6d3425；
     系统无衬线字体，标题字重 650；细线分隔、不用投影；主操作 lime 填充。只借视觉语言，未复制其代码或素材 */
  :root { --canvas:#f5f5f5; --surface:#fff; --ink:#201f1c; --muted:#5a514a; --line:#d8d1cb; --soft:#eeeae6; --seg:#e8e4df; --segline:#b9b1aa; --tag:#eeebe7; --status:#f7ffc4; --accent:#dfff2f; --brand:#6d3425; --metro:#b3261e; --bus:#2f6b4f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  body.picking #c { cursor:crosshair; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .lb { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-size:12px; pointer-events:none; font-variant-numeric:tabular-nums; }
  .lb.hit { pointer-events:auto; cursor:pointer; }
  body.picking .lb.hit { pointer-events:none; }
  .lb.hit:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  .lb.loft { font-weight:650; font-size:14px; color:var(--ink); text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; }
  .lb.loft.sel { background:var(--accent); border:2px solid var(--brand); border-radius:4px; padding:0 5px; text-shadow:none; }
  /* C2 主会场强化（候选） */
  .lb.c2 { font-size:16px; font-weight:650; border-radius:4px; padding:2px 8px; text-shadow:none; z-index:1; }
  .lb.c2-a { background:var(--brand); color:#fff; }
  .lb.c2.sel { background:var(--accent); color:var(--ink); border:2px solid var(--brand); }   /* 选中时 lime 底配深色字，白字在 lime 上看不清 */
  .lb.c2-b { background:none; color:var(--ink); font-size:20px; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; }   /* 单行字不加框（pollux 约定） */
  .lb.c2-c { background:none; color:#fff; font-size:20px; text-shadow:none; }   /* 标牌不用黑底白字（pollux 约定），只靠深色体量强化 */
  .lb.c2flag { background:var(--brand); color:#fff; font-size:12px; font-weight:650; padding:1px 6px; border-radius:2px; pointer-events:auto; cursor:pointer; }
  .lb.road { color:var(--muted); font-size:12px; letter-spacing:1px; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; }
  .lb.metro { background:var(--surface); color:var(--metro); border:1px solid var(--metro); padding:1px 7px; border-radius:4px; font-weight:650; }
  .lb.exit { background:var(--metro); color:#fff; padding:0 4px; border-radius:4px; font-size:11px; font-weight:650; }
  .lb.bus { background:var(--surface); color:var(--bus); border:1px solid var(--bus); padding:0 5px; border-radius:4px; font-size:11px; }
  .lb.route { background:var(--ink); color:#fff; padding:1px 7px; border-radius:4px; font-weight:650; }
  .lb.route.end { background:var(--accent); color:var(--ink); border:2px solid var(--brand); }
  /* 顶栏：大标题 + 右侧小字场所名（同参考 Map 页） */
  header { position:fixed; top:16px; left:16px; width:min(420px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 15px 12px; }
  header .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  header h1 { margin:0; font-size:28px; font-weight:650; letter-spacing:-0.4px; line-height:1.15; }
  header .hub { font-size:12px; color:var(--ink); }
  header p { margin:6px 0 0; font-size:13px; color:var(--muted); }
  /* 图层开关 / 视角：分段控件，选中 lime、未选中浅灰、无外框（同参考 List/Week/Month） */
  .legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .seg { min-height:36px; padding:6px 11px; border-radius:8px; border:none; background:var(--soft); color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:13px; }
  .legend .seg { background:var(--soft); color:var(--muted); box-shadow:inset 0 0 0 1px transparent; }
  .legend .seg[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--segline); }
  .legend .seg.icon { width:44px; height:44px; min-height:44px; padding:0; justify-content:center; }
  .legend .seg.icon svg { display:block; }
  .legend .seg[aria-pressed="false"]:not(.emph-btn) svg { opacity:.3; }
  /* 「强调园区楼栋」：未按下是普通白底；按下用品牌棕（参考项目第二主题色）实心强化 */
  .legend .seg.emph-btn { background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--segline); }
  .legend .seg.emph-btn[aria-pressed="true"] { background:var(--brand); color:#fff; box-shadow:none; }
  body.emph .lb.loft { background:var(--brand); color:#fff; text-shadow:none; border-radius:4px; padding:0 5px; }
  body.emph .lb.loft.sel { background:var(--accent); color:var(--ink); }
  .legend { flex-wrap:nowrap; justify-content:space-between; }
  #views .seg.on { background:var(--accent); color:var(--ink); }   /* lime 只留给选中和主操作 */
  .seg:focus-visible, #panel button:focus-visible, .slot-x:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .sw { width:10px; height:10px; border-radius:2px; display:inline-block; border:1px solid #0003; }
  #views { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:6px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px; max-width:calc(100vw - 32px); overflow-x:auto; }
  #views .seg { min-height:40px; white-space:nowrap; background:var(--surface); color:var(--ink); }
  #views .seg.empty { color:var(--muted); background:var(--canvas); }
  #views .seg.primary { background:var(--accent); color:var(--ink); font-weight:650; }
  #views .seg.primary[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .slot { display:inline-flex; align-items:center; background:var(--soft); border-radius:8px; }
  .slot .seg { background:transparent !important; padding-right:4px; }
  .slot-x { border:none; background:none; width:32px; min-height:40px; color:var(--muted); cursor:pointer; font-size:16px; }
  #views .div { width:1px; align-self:stretch; background:var(--line); margin:4px 2px; }
  body.iso #views .seg.on::after { content:attr(data-lock); font-size:11px; color:var(--muted); margin-left:2px; }
  /* 语言切换：同参考的分段控件 */
  /* 语言切换：单个按钮，只显示要切换过去的那种语言（中文状态显示 EN，英文状态显示 中文），减少视觉占用 */
  #lang { display:inline-flex; }
  #langBtn { border:1px solid var(--line); background:var(--surface); min-height:36px; min-width:44px; padding:0 10px; border-radius:8px; font-size:13px; font-weight:650; color:var(--ink); cursor:pointer; }
  #langBtn:hover { background:var(--soft); }
  #langBtn:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  header .hub { margin-top:2px; }
  #hint { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:calc(100vw - 32px); text-align:center; background:var(--ink); color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; }
  /* 详情：同参考 Event details，分段标题 + 细线分隔 + 底部主操作 */
  #panel { position:fixed; right:16px; top:16px; width:min(340px, calc(100vw - 32px)); max-height:calc(100vh - 110px); overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 20px; font-size:15px; display:none; }
  #panel .eyebrow { font-size:13px; color:var(--muted); }
  #panel h2 { margin:2px 0 6px; font-size:26px; font-weight:650; letter-spacing:-0.3px; line-height:1.2; }
  #panel .tags { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
  #panel .tag { font-size:12px; background:var(--tag); border-radius:4px; padding:2px 6px; }
  #panel .status-pill { font-size:12px; background:var(--status); border-radius:4px; padding:2px 6px; }
  #panel section { padding:12px 0; border-top:1px solid var(--line); margin-top:10px; }
  #panel section h3 { margin:0 0 4px; font-size:15px; font-weight:650; }
  #panel section p { margin:0; }
  #panel .k { color:var(--muted); font-size:13px; }
  /* 迷你时间线：左侧细线 + 年份等宽数字 */
  #panel .tl ol { list-style:none; margin:0; padding:0 0 0 12px; border-left:1px solid var(--line); }
  #panel .tl li { position:relative; display:flex; gap:10px; padding:4px 0; font-size:14px; }
  #panel .tl li::before { content:""; position:absolute; left:-16px; top:12px; width:7px; height:7px; border-radius:50%; background:var(--brand); }
  #panel .tl .yr { flex:none; width:46px; font-weight:650; font-variant-numeric:tabular-nums; }
  #panel .tl .ev small { display:block; font-size:12px; color:var(--muted); }
  /* 相关报道 */
  #panel .refs ul { list-style:none; margin:0; padding:0; }
  #panel .refs li { padding:8px 0; border-top:1px solid var(--soft); }
  #panel .refs li:first-child { border-top:none; padding-top:0; }
  #panel .refs a { color:var(--ink); font-weight:650; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
  #panel .refs a:hover { text-decoration-color:var(--ink); }
  #panel .refs .nolink { font-weight:650; }
  #panel .refs .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  #panel .refs p { font-size:14px; margin:2px 0 0; }
  #panel .refs details summary { cursor:pointer; font-size:13px; color:var(--ink); min-height:44px; display:flex; align-items:center; }
  #panel .refs .foot { margin-top:8px; font-size:12px; }
  #panel .actions { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--line); margin-top:4px; }
  #panel .primary { flex:1; min-height:44px; border:none; border-radius:8px; background:var(--accent); font-weight:650; font-size:14px; cursor:pointer; }
  #panel .ghost { min-height:44px; padding:0 14px; border:1px solid var(--segline); border-radius:8px; background:var(--surface); cursor:pointer; font-size:14px; }
  #panel .x { position:absolute; right:6px; top:6px; width:44px; height:44px; border:none; background:none; font-size:22px; color:var(--muted); cursor:pointer; }
  header .attr { margin-top:8px; font-size:11px; color:var(--muted); }   /* ODbL 署名常驻顶栏，不和底部工具条重叠 */
  /* 布局分档（避免组件重叠）：≥ 900px 顶栏左上 + 详情右上；641–899px 详情改成工具条上方的整宽底部卡；≤ 640px 手机底部卡 */
  @media (max-width: 899px) {
    #panel { top:auto; left:16px; right:16px; width:auto; bottom:84px; max-height:min(45vh, calc(100vh - 84px - 16px - var(--header-h, 200px) - 12px)); }   /* 不超过半屏，地图仍可见 */
    #views { max-width:calc(100vw - 32px); }
  }
  @media (max-width: 640px) {
    header { top:10px; left:10px; right:10px; width:auto; padding:10px 12px; }
    header h1 { font-size:22px; } header p { display:none; }
    .seg { min-height:44px; font-size:12px; padding:4px 9px; }
    #views { left:10px; right:10px; transform:none; bottom:calc(10px + env(safe-area-inset-bottom)); }
    #panel { top:auto; bottom:calc(76px + env(safe-area-inset-bottom)); right:10px; left:10px; width:auto; max-height:calc(100vh - 76px - env(safe-area-inset-bottom) - var(--header-h, 200px) - 20px); z-index:2; }
  }

  /* ===== 手机版方案 C（pollux 2026-11-20 选定；来自 mobile-plan/rebase.py） ===== */
  :root { --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  @media (max-width: 640px) {
    header { top:calc(var(--st) + 8px); }
    #langBtn { min-height:44px; }
    .mprimary { min-height:48px; border:none; border-radius:8px; background:var(--accent); color:var(--ink); font-weight:650; font-size:15px; cursor:pointer; padding:0 10px; }
    .mprimary[aria-pressed="true"] { background:var(--ink); color:#fff; }
    .mprimary:focus-visible, .tab:focus-visible, .mghost:focus-visible, #grab:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    .mghost { min-height:44px; padding:0 12px; border:1px solid var(--segline); border-radius:8px; background:var(--surface); font-size:13px; cursor:pointer; }
    .mghost.on { background:var(--accent); border-color:var(--accent); font-weight:650; }
    .mghost.add { border-style:dashed; color:var(--muted); background:var(--canvas); }
    /* 快捷视角格：等距 / 初始 / 1–3 */
    #mviews.quick { display:flex; gap:6px; }
    #mviews.quick .seg { background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); flex:1 1 auto; padding:0 8px; font-size:14px; min-height:44px; justify-content:center; }
    #mviews.quick .seg.on { background:var(--accent); box-shadow:none; }
    #mviews.quick .slotb { flex:0 0 44px; padding:0; font-variant-numeric:tabular-nums; }
    #mviews.quick .slotb.empty { background:var(--canvas); color:var(--muted); box-shadow:none; border:1px dashed var(--segline); }
    #mviews.quick .slotb.cur { box-shadow:inset 0 0 0 2px var(--ink); }
    #mviews.quick .div { width:1px; background:var(--line); margin:6px 0; flex:none; }
    /* 视角管理：一格一行，按钮写明（不靠长按或再点一次） */
    .vrows .row { display:flex; align-items:center; gap:8px; min-height:56px; border-top:1px solid var(--line); }
    .vrows .row:first-child { border-top:none; }
    .vrows .nm { flex:1; font-size:15px; }
    .vrows .nm small { display:block; font-size:12px; color:var(--muted); }
    #panel .actions { position:sticky; bottom:-16px; background:var(--surface); padding-bottom:14px; margin-bottom:-14px; }
  }

  @media (min-width: 641px) { #sheet, .attr-m { display:none; } }
  @media (max-width: 640px) {
    /* 方案 C：顶部只留标题和语言两个小浮块；图层、视角、署名全文、详情、导航结果都进一个可拖动的底部面板（收起 / 展开两档） */
    header { left:10px; right:10px; padding:0; background:none; border:none; pointer-events:none; }
    header .top { align-items:center; }
    header h1 { pointer-events:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:0 14px; height:54px; display:flex; align-items:center; font-size:18px; }
    header #lang { pointer-events:auto; }
    header #langBtn { height:54px; min-width:54px; border-radius:10px; font-size:15px; }   /* 和左侧标题浮块同高 */
    header .hub { display:none; }
    .attr-m { position:fixed; left:10px; bottom:calc(var(--sheetH, 170px) + 6px); font-size:11px; color:var(--muted); background:rgba(245,245,245,.88); padding:1px 6px; border-radius:4px; max-width:calc(100vw - 20px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; z-index:1; transition:bottom .25s; }
    #sheet { position:fixed; left:0; right:0; bottom:0; height:var(--sheetH, 170px); background:var(--surface); border-top:1px solid var(--line); border-radius:14px 14px 0 0; z-index:4; display:flex; flex-direction:column; transition:height .25s cubic-bezier(.2,.8,.2,1); }
    #sheet.dragging { transition:none; }
    #grab { flex:none; height:44px; margin-bottom:-8px; border:none; background:none; width:100%; cursor:grab; touch-action:none; display:flex; justify-content:center; padding-top:10px; }
    #grab::before { content:""; width:40px; height:5px; border-radius:3px; background:var(--line); }
    #sheetBody { flex:1; overflow:auto; padding:0 14px calc(var(--sb) + 12px); overscroll-behavior:contain; }
    .peek { display:flex; flex-direction:column; gap:8px; padding-bottom:12px; }
    #views { display:none; }   /* 手机上桌面工具条隐藏，改用面板 */
    #mviews { position:static; transform:none; border:none; padding:0; background:none; max-width:none; overflow:visible; border-radius:0; }
    .more > section { padding:12px 0; border-top:1px solid var(--line); }
    .more h3 { margin:0 0 8px; font-size:15px; font-weight:650; }
    .more p, #attrSlot .attr { margin:0; font-size:13px; color:var(--muted); }
    #legendSlot .legend { margin:0; padding:0; border:none; }
    #sheet.lv0 .more, #sheet.lv0 #pc section { visibility:hidden; }
    #panel { position:relative; inset:auto; display:none; padding:0; border:none; width:auto; max-height:none; overflow:visible; border-radius:0; }
    #panel .x { right:-8px; top:-6px; }
    #panel .actions { position:static; margin:10px 0 0; padding-bottom:0; }
    #panel section:first-of-type { margin-top:12px; }
    body.card #home { display:none; }
    #hint { bottom:calc(var(--sheetH, 170px) + 30px); }
  }

  /* 指北针（camera-plan.md 方案 B）：细线圆钮，北针用品牌棕；≥900 右下角，641–899 右上角（详情卡在底部），手机在标题浮块下方右侧 */
  #compass { position:fixed; right:16px; bottom:16px; width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; cursor:pointer; padding:0; z-index:3; }
  #compass svg { display:block; }
  #compass:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  @media (max-width: 899px) { #compass { bottom:auto; top:16px; } }
  @media (max-width: 640px) { #compass { right:10px; top:calc(var(--st, 0px) + 8px + 54px + 10px); } }
  .lb.hit { touch-action:none; }   /* 标签上的手势交给画布（main.js 转发），不让浏览器拿去缩放页面 */
  #labels { -webkit-user-select:none; user-select:none; }   /* 从标签上开始拖动时不选中文字 */
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<header>
  <div class="top"><h1>OCT-LOFT</h1><div id="lang"><button type="button" id="langBtn"></button></div></div>
  <div class="hub" data-i18n="hub"></div>
  <p data-i18n="intro"></p>
  <div class="legend" id="legend" role="group" data-i18n-aria="layers"></div>
  <div class="attr" data-i18n="footer"></div>
</header>
<div id="panel"><button class="x" id="close" data-i18n-aria="close" aria-label="关闭">×</button><div id="pc"></div></div>
<nav id="views" data-i18n-aria="viewsNav" aria-label="视角与导航"></nav>
<div class="attr-m" data-i18n="footerShort"></div>
<section id="sheet" aria-label="面板">
  <button type="button" id="grab" data-i18n-aria="grab" aria-label="展开或收起面板" aria-expanded="false"></button>
  <div id="sheetBody">
    <div id="home">
      <div class="peek"><button type="button" class="mprimary" id="navBtn"></button><nav id="mviews" class="quick" data-i18n-aria="viewsNav" aria-label="视角"></nav></div>
      <div class="more">
        <section><h3 data-i18n="layersT"></h3><div id="legendSlot"></div></section>
        <section><h3 data-i18n="viewsTab"></h3><div id="slotRows" class="vrows"></div></section>
        <section><h3 data-i18n="hub"></h3><p data-i18n="introM"></p></section>
        <section id="attrSlot"></section>
      </div>
    </div>
    <div id="panelSlot"></div>
  </div>
</section>

for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { if (e.target === canvas || canvas.hasPointerCapture?.(e.pointerId)) canvasPointers = Math.max(0, canvasPointers - 1); if (lblDown?.pointerId === e.pointerId) lblDown = null; }, true);
const toCanvas = (e) => canvas.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true, clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY, pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: e.isPrimary, button: e.button, buttons: e.buttons, ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, metaKey: e.metaKey }));
labelsEl.addEventListener("wheel", (e) => { e.preventDefault(); canvas.dispatchEvent(new WheelEvent("wheel", e)); }, { passive: false });
labelsEl.addEventListener("pointerdown", (e) => { if (canvasPointers > 0) { toCanvas(e); return; } lblDown = { pointerId: e.pointerId, x: e.clientX, y: e.clientY, e }; });
addEventListener("pointermove", (e) => { if (lblDown && e.pointerId === lblDown.pointerId && Math.hypot(e.clientX - lblDown.x, e.clientY - lblDown.y) > 5) { const d0 = lblDown.e; lblDown = null; toCanvas(d0); } });
labelsEl.addEventListener("contextmenu", (e) => e.preventDefault());   // 右键拖动平移时不弹菜单

// 启动：URL 里带视角就用它，否则按当前屏幕看全园区（候选页的 OCT_FOCUS 优先）
if (!window.OCT_FOCUS) { const hs = readHash(); goTo(hs || VIEW_DEFAULT, 0); renderViews(); }
renderer.setAnimationLoop((now) => { if (tween) tween(now); controls.update(); cameraGuard(); renderer.render(scene, camera); placeLabels(); updateCompass(); });
// 详情卡开关 → body.card（手机面板据此切换首页 / 详情）
new MutationObserver(() => { const on = panel.style.display === "block"; if (on !== document.body.classList.contains("card")) { document.body.classList.toggle("card", on); onCard(on); } }).observe(panel, { attributes: true, attributeFilter: ["style"] });
window.__ready = true;

</script>
</body>
